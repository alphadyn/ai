<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar Legal Docketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">⚖</div>
          <div>
            <h1>Northstar Legal Docketing</h1>
            <p>Modern case, deadline, and task management for legal teams.</p>
          </div>
        </div>
        <button id="newMatterBtn" class="btn btn-primary">+ New Matter</button>
      </header>

      <section id="statsGrid" class="stats-grid"></section>

      <main class="content-grid">
        <aside class="panel panel-left">
          <div class="panel-header">
            <div>
              <h2>Matters</h2>
              <p>Track active cases and upcoming hearings.</p>
            </div>
            <div class="panel-actions">
              <input id="matterSearch" type="search" placeholder="Search matters" />
              <button id="toggleMatterFormBtn" class="btn btn-secondary">Add</button>
            </div>
          </div>

          <form id="matterForm" class="card-form hidden">
            <h3>Create Matter</h3>
            <div class="form-grid">
              <label>
                <span>Case title</span>
                <input name="title" required />
              </label>
              <label>
                <span>Client</span>
                <input name="client" required />
              </label>
              <label>
                <span>Matter type</span>
                <input name="matterType" value="Litigation" />
              </label>
              <label>
                <span>Status</span>
                <select name="status">
                  <option value="Open">Open</option>
                  <option value="Pending">Pending</option>
                  <option value="Closed">Closed</option>
                </select>
              </label>
              <label>
                <span>Court / venue</span>
                <input name="court" placeholder="Superior Court" />
              </label>
              <label>
                <span>Next hearing</span>
                <input name="nextHearing" type="date" />
              </label>
              <label>
                <span>Assigned attorney</span>
                <input name="assigned" placeholder="Jane Doe" />
              </label>
            </div>
            <label>
              <span>Summary</span>
              <textarea name="description" rows="3" placeholder="Describe the matter"></textarea>
            </label>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save Matter</button>
              <button type="button" id="cancelMatterBtn" class="btn btn-ghost">Cancel</button>
            </div>
          </form>

          <div id="matterList" class="matter-list"></div>
        </aside>

        <section class="panel panel-right">
          <div class="panel-header">
            <div>
              <h2>Case Workspace</h2>
              <p>Manage deadlines, tasks, and case context.</p>
            </div>
          </div>

          <div id="matterDetail" class="matter-detail"></div>

          <div class="task-section">
            <div class="task-header">
              <h3>Task Tracker</h3>
              <form id="taskForm" class="task-form">
                <input name="title" placeholder="New task" required />
                <input name="dueDate" type="date" required />
                <select name="priority">
                  <option value="High">High</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="Low">Low</option>
                </select>
                <select id="taskMatterSelect" name="matterId"></select>
                <button type="submit" class="btn btn-primary">Add Task</button>
              </form>
            </div>

            <div class="task-toolbar">
              <button class="filter-pill active" data-filter="all">All</button>
              <button class="filter-pill" data-filter="pending">Pending</button>
              <button class="filter-pill" data-filter="completed">Completed</button>
            </div>

            <div id="taskList" class="task-list"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
