<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal Docketing App</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #14213d; }
    header { background: linear-gradient(135deg, #0f4c81, #2563eb); color: white; padding: 1.25rem 1.5rem; }
    main { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem 2rem; }
    .grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 1rem; }
    .panel { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h2, h3 { margin-top: 0; }
    form { display: grid; gap: 0.7rem; }
    input, select, textarea, button { padding: 0.6rem 0.7rem; font-size: 1rem; border-radius: 8px; border: 1px solid #d0d7de; }
    button { background: #2563eb; color: white; cursor: pointer; border: none; }
    button.secondary { background: #64748b; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .case-card, .event-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.7rem; }
    .muted { color: #64748b; font-size: 0.95rem; }
    .danger { color: #b91c1c; }
    .success { color: #15803d; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .pill { display: inline-block; background: #e0f2fe; color: #075985; padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.8rem; margin-right: 0.35rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 0.55rem; text-align: left; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Legal Docketing App</h1>
    <p>Manage matters, deadlines, filings, and docket entries from one place.</p>
  </header>

  <main>
    <div class="grid">
      <section class="panel">
        <div class="toolbar">
          <h2>New Matter</h2>
          <span class="pill">Local storage</span>
        </div>
        <form id="matter-form">
          <div class="row">
            <input id="matter-id" placeholder="Matter ID" required />
            <input id="matter-title" placeholder="Case title" required />
          </div>
          <div class="row">
            <input id="matter-client" placeholder="Client name" required />
            <select id="matter-type">
              <option>Litigation</option>
              <option>Transactional</option>
              <option>IP</option>
              <option>Family</option>
              <option>Employment</option>
            </select>
          </div>
          <textarea id="matter-notes" rows="3" placeholder="Case notes"></textarea>
          <div class="row">
            <input id="matter-court" placeholder="Court / jurisdiction" />
            <input id="matter-status" placeholder="Status" value="Open" />
          </div>
          <button type="submit">Save Matter</button>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h2>New Docket Event</h2>
          <span class="pill">Deadline tracking</span>
        </div>
        <form id="event-form">
          <select id="event-matter"></select>
          <input id="event-title" placeholder="Event title" required />
          <input id="event-date" type="date" required />
          <select id="event-type">
            <option>Hearing</option>
            <option>Deadline</option>
            <option>Filing</option>
            <option>Meeting</option>
            <option>Service</option>
          </select>
          <textarea id="event-notes" rows="3" placeholder="Notes"></textarea>
          <button type="submit">Add Event</button>
        </form>
      </section>
    </div>

    <section class="panel" style="margin-top:1rem;">
      <div class="toolbar">
        <h2>Matters</h2>
        <button class="secondary" id="clear-data">Clear All Data</button>
      </div>
      <div id="matters-list"></div>
    </section>

    <section class="panel" style="margin-top:1rem;">
      <div class="toolbar">
        <h2>Upcoming Docket Events</h2>
      </div>
      <table>
        <thead>
          <tr><th>Case</th><th>Event</th><th>Date</th><th>Type</th><th>Status</th></tr>
        </thead>
        <tbody id="events-table"></tbody>
      </table>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'legal_docketing_app_data';
    const defaultState = { matters: [], events: [] };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : defaultState;
      } catch {
        return defaultState;
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getState() {
      return loadState();
    }

    function render() {
      const state = getState();
      const mattersList = document.getElementById('matters-list');
      const eventsTable = document.getElementById('events-table');
      const eventMatterSelect = document.getElementById('event-matter');

      eventMatterSelect.innerHTML = '<option value="">Select matter</option>' + state.matters.map(m => `<option value="${m.id}">${m.title}</option>`).join('');

      if (!state.matters.length) {
        mattersList.innerHTML = '<p class="muted">No matters yet. Add the first case to get started.</p>';
      } else {
        mattersList.innerHTML = state.matters.map((matter) => {
          const relatedEvents = state.events.filter(e => e.matterId === matter.id);
          return `
            <div class="case-card">
              <div class="toolbar">
                <strong>${matter.title}</strong>
                <span class="pill">${matter.type}</span>
              </div>
              <div class="muted">Matter ID: ${matter.id} · Client: ${matter.client}</div>
              <div class="muted">Court: ${matter.court || '—'} · Status: ${matter.status}</div>
              <p>${matter.notes || 'No notes.'}</p>
              <div>
                ${relatedEvents.length ? relatedEvents.map(e => `<div class="event-card"><strong>${e.title}</strong><div class="muted">${e.date} · ${e.type}</div><div>${e.notes || ''}</div></div>`).join('') : '<div class="muted">No events yet.</div>'}
              </div>
              <div style="margin-top:0.5rem;">
                <button class="secondary" onclick="removeMatter('${matter.id}')">Delete</button>
              </div>
            </div>`;
        }).join('');
      }

      const sortedEvents = [...state.events].sort((a,b) => a.date.localeCompare(b.date));
      if (!sortedEvents.length) {
        eventsTable.innerHTML = '<tr><td colspan="5" class="muted">No docket events yet.</td></tr>';
      } else {
        eventsTable.innerHTML = sortedEvents.map((event) => {
          const matter = state.matters.find((m) => m.id === event.matterId);
          const overdue = new Date(event.date) < new Date(new Date().toDateString());
          return `<tr><td>${matter ? matter.title : 'Unknown'}</td><td>${event.title}</td><td class="${overdue ? 'danger' : 'success'}">${event.date}</td><td>${event.type}</td><td>${overdue ? 'Overdue' : 'Upcoming'}</td></tr>`;
        }).join('');
      }
    }

    function removeMatter(id) {
      const state = getState();
      state.matters = state.matters.filter((m) => m.id !== id);
      state.events = state.events.filter((e) => e.matterId !== id);
      saveState(state);
      render();
    }

    document.getElementById('matter-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const state = getState();
      const matter = {
        id: document.getElementById('matter-id').value.trim(),
        title: document.getElementById('matter-title').value.trim(),
        client: document.getElementById('matter-client').value.trim(),
        type: document.getElementById('matter-type').value,
        notes: document.getElementById('matter-notes').value.trim(),
        court: document.getElementById('matter-court').value.trim(),
        status: document.getElementById('matter-status').value.trim() || 'Open'
      };
      if (!matter.id || !matter.title || !matter.client) return;
      state.matters.push(matter);
      saveState(state);
      e.target.reset();
      document.getElementById('matter-status').value = 'Open';
      render();
    });

    document.getElementById('event-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const state = getState();
      const event = {
        matterId: document.getElementById('event-matter').value,
        title: document.getElementById('event-title').value.trim(),
        date: document.getElementById('event-date').value,
        type: document.getElementById('event-type').value,
        notes: document.getElementById('event-notes').value.trim()
      };
      if (!event.matterId || !event.title || !event.date) return;
      state.events.push(event);
      saveState(state);
      e.target.reset();
      render();
    });

    document.getElementById('clear-data').addEventListener('click', () => {
      if (confirm('Clear all matters and events?')) {
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    });

    render();
  </script>
</body>
</html>
