<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractal Atlas: 10 Classic Patterns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="app-shell" id="app-shell">
    <aside class="panel">
      <h1>Fractal Atlas</h1>
      <p class="subtitle">Generate 10 popular fractal patterns with one click.</p>

      <label for="fractal-select">Pattern</label>
      <select id="fractal-select" aria-label="Select fractal pattern"></select>

      <div class="controls-row">
        <label for="detail">Detail</label>
        <input id="detail" type="range" min="1" max="10" value="6" />
        <span id="detail-value">6</span>
      </div>

      <div class="button-row">
        <button id="render-btn" class="btn-primary">Render</button>
        <button id="random-btn" class="btn-secondary">Random Pick</button>
        <button id="zoom-in-btn" class="btn-secondary">Zoom In</button>
        <button id="zoom-out-btn" class="btn-secondary">Zoom Out</button>
        <button id="reset-view-btn" class="btn-secondary">Reset View</button>
      </div>

      <p id="pattern-description" class="description"></p>

      <ul class="fractal-list" id="fractal-list"></ul>
    </aside>

    <section class="canvas-wrap">
      <canvas id="fractal-canvas" width="980" height="680" aria-label="Fractal canvas"></canvas>
      <button id="toggle-controls-btn" class="toggle-controls-btn" type="button">Hide Controls</button>
      <div id="status" class="status">Ready</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
