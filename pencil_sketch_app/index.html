<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil Sketch Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Image Effects</p>
          <h1>Pencil Sketch Studio</h1>
        </div>
      </header>

      <main class="app-card">
        <section class="controls">
          <label class="file-picker">
            <span>Choose an image</span>
            <input id="fileInput" type="file" accept="image/*" />
          </label>

          <label class="selector" for="modeSelect">
            <span>Sketch style</span>
            <select id="modeSelect">
              <option value="bw">Black &amp; White</option>
              <option value="color">Color Pencil</option>
            </select>
          </label>

          <label class="slider-group" for="accuracyRange">
            <span>Accuracy to original</span>
            <div class="slider-row">
              <input id="accuracyRange" type="range" min="10" max="100" step="1" value="70" />
              <output id="accuracyValue" for="accuracyRange">70%</output>
            </div>
          </label>

          <label class="slider-group" for="strokeLengthRange">
            <span>Pencil stroke length</span>
            <div class="slider-row">
              <input id="strokeLengthRange" type="range" min="10" max="100" step="1" value="65" />
              <output id="strokeLengthValue" for="strokeLengthRange">65%</output>
            </div>
          </label>

          <label class="slider-group" for="brightnessRange">
            <span>Brightness</span>
            <div class="slider-row">
              <input id="brightnessRange" type="range" min="0" max="100" step="1" value="65" />
              <output id="brightnessValue" for="brightnessRange">65%</output>
            </div>
          </label>

          <label class="slider-group" for="redFilterRange">
            <span>Red filter</span>
            <div class="slider-row">
              <input id="redFilterRange" type="range" min="0" max="100" step="1" value="50" />
              <output id="redFilterValue" for="redFilterRange">50%</output>
            </div>
          </label>

          <label class="slider-group" for="greenFilterRange">
            <span>Green filter</span>
            <div class="slider-row">
              <input id="greenFilterRange" type="range" min="0" max="100" step="1" value="50" />
              <output id="greenFilterValue" for="greenFilterRange">50%</output>
            </div>
          </label>

          <label class="slider-group" for="blueFilterRange">
            <span>Blue filter</span>
            <div class="slider-row">
              <input id="blueFilterRange" type="range" min="0" max="100" step="1" value="50" />
              <output id="blueFilterValue" for="blueFilterRange">50%</output>
            </div>
          </label>

          <div class="button-row">
            <button id="generateBtn" type="button">Generate Sketch</button>
            <button id="downloadBtn" class="secondary" type="button">Download PNG</button>
          </div>

          <p id="status" class="status">Upload an image to begin.</p>
        </section>

        <section class="preview-grid">
          <figure class="panel">
            <figcaption>Original</figcaption>
            <canvas id="originalCanvas" width="640" height="480"></canvas>
          </figure>

          <figure class="panel">
            <figcaption>Sketch</figcaption>
            <canvas id="sketchCanvas" width="640" height="480"></canvas>
          </figure>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
