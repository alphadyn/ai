<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="/ai/analytics.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore ten rotating photographs with automatic slides, captions, thumbnails, and fullscreen viewing." />
  <title>Rotating Photo Gallery</title>
  <link rel="canonical" href="https://alphadyn.github.io/ai/photo-gallery/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rotating Photo Gallery" />
  <meta property="og:url" content="https://alphadyn.github.io/ai/photo-gallery/" />
  <meta property="og:title" content="Rotating Photo Gallery" />
  <meta property="og:description" content="Explore ten rotating photographs with automatic slides, captions, thumbnails, and fullscreen viewing." />
  <meta property="og:image" content="https://alphadyn.github.io/ai/photo-gallery/social-preview.png" />
  <meta property="og:image:secure_url" content="https://alphadyn.github.io/ai/photo-gallery/social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A pastel sunset over a turquoise beach in the rotating photo gallery." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rotating Photo Gallery" />
  <meta name="twitter:description" content="Explore ten rotating photographs with automatic slides, captions, thumbnails, and fullscreen viewing." />
  <meta name="twitter:image" content="https://alphadyn.github.io/ai/photo-gallery/social-preview.png" />
  <meta name="twitter:image:alt" content="A pastel sunset over a turquoise beach in the rotating photo gallery." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="header">
      <h1>Rotating Photo Gallery</h1>
      <p class="subtitle">10 beautiful photos, auto-rotating in a carousel.</p>
    </header>

    <section class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Photo gallery">
      <div class="carousel-track" id="carousel-track"></div>

      <button class="nav-btn prev-btn" id="prev-btn" aria-label="Previous photo">&#10094;</button>
      <button class="nav-btn next-btn" id="next-btn" aria-label="Next photo">&#10095;</button>

      <div class="carousel-overlay">
        <span class="caption" id="caption"></span>
        <div class="overlay-controls">
          <button class="maximize-btn" id="maximize-btn" aria-label="Maximize photo">⛶</button>
          <button class="play-btn" id="play-btn" aria-label="Pause rotation">&#10073;&#10073;</button>
        </div>
      </div>
    </section>

    <!-- Fullscreen modal for maximized photo -->
    <div class="fullscreen-modal" id="fullscreen-modal">
      <div class="fullscreen-content">
        <img class="fullscreen-img" id="fullscreen-img" src="" alt="Maximized photo" />
        <button class="close-modal-btn" id="close-modal-btn" aria-label="Close fullscreen">✕</button>
        <div class="fullscreen-caption" id="fullscreen-caption"></div>
      </div>
    </div>

    <nav class="thumbnails" id="thumbnails" aria-label="Photo thumbnails"></nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
