name: Deploy Alphadyn AI Apps to Pages

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - .github/workflows/deploy-sp500-report.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build S&P 500 market snapshot
        run: python3 market_lens_app/build_data.py

      - name: Build Pulse post previews
        run: |
          python3 -m pip install --disable-pip-version-check -r pulse/requirements-build.txt
          python3 pulse/build_share_pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4